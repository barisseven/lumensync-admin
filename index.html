<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Yönetici Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; margin-bottom: 10px; }
        .counter-box { background: #2c2c2c; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 16px; border: 1px solid #444; }
        .counter-box span { color: #4CAF50; font-weight: bold; font-size: 20px; }
        
        .control-group { background: #2c2c2c; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; border: 1px solid #444; }
        .control-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #ccc; }
        input[type="text"], select, input[type="number"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #1e1e1e; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; color: #fff; }
        .btn-preload { background: #ff5722; }
        .btn-manual { background: #4CAF50; }
        .btn-stop { background: #f44336; }
        #log { margin-top: 10px; font-size: 14px; color: #aaa; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎛️ Lumen Sync Admin</h2>
        
        <div class="counter-box">
            👥 Aktif Katılımcı: <span id="client-count">0</span>
        </div>

        <div class="control-group">
            <label>🎨 Efekt Rengi (HEX / RGB / RGBA):</label>
            <input type="text" id="effectColor" value="rgb(255, 0, 0)">

            <label>⚡ Manuel Komut / Aksiyon:</label>
            <select id="manualAction">
                <option value="ON">ON (Işığı Aç)</option>
                <option value="OFF">OFF (Kapat)</option>
                <option value="STROBE" selected>STROBE (Çakar)</option>
                <option value="PULSE">PULSE (Nefes)</option>
            </select>

            <label>⏱️ Hız / Speed (Strobe için ms, örn: 80):</label>
            <input type="number" id="effectSpeed" value="80" min="16" max="5000">
        </div>
        
        <button class="btn-manual" onclick="sendManualCommand()">Manuel Komut Gönder</button>
        <button class="btn-preload" onclick="sendTimelineShow()">🚀 Şov Senaryosunu Başlat (Timeline)</button>
        <button class="btn-stop" onclick="sendEmergencyStop()">Acil Karartma (STOP)</button>
        
        <div id="log">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Canlı aktif katılımcı sayacı (Son 60 saniyede sinyal verenler)
        onSnapshot(collection(db, "clients"), (snapshot) => {
            let activeCount = 0;
            const now = Date.now();
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.lastSeen && (now - data.lastSeen < 60000)) {
                    activeCount++;
                }
            });
            document.getElementById('client-count').innerText = activeCount;
        }, (error) => {
            console.warn("Client sayaç dinleme hatası:", error);
        });

        // 1. Manuel Komut Gönderme
        window.sendManualCommand = async function() {
            const logEl = document.getElementById('log');
            const color = document.getElementById('effectColor').value.trim();
            const action = document.getElementById('manualAction').value;
            const speed = Number(document.getElementById('effectSpeed').value);

            try {
                await setDoc(doc(db, "show", "command"), {
                    triggerId: crypto.randomUUID(),
                    startTime: Date.now() + 2000, // 2 saniye sonra senkron başlar
                    action: action,
                    color: color,
                    speed: speed
                });
                logEl.innerText = `Manuel Komut Gönderildi: ${action} (${color})`;
                logEl.style.color = "#4CAF50";
            } catch (err) {
                console.error("Manuel komut hatası:", err);
                logEl.innerText = "Hata! Komut iletilemedi: " + err.message;
                logEl.style.color = "#f44336";
            }
        };

        // 2. Timeline Senaryosu Gönderme
        window.sendTimelineShow = async function() {
            const logEl = document.getElementById('log');
            const showStartTime = Date.now() + 3000; // 3 saniye sonra başlar

            const sampleTimeline = [
                { timeOffset: 0,     action: 'ON',     color: '#ff0000' },
                { timeOffset: 5000,  action: 'STROBE', color: '#ffffff', speed: 80 },
                { timeOffset: 12000, action: 'PULSE',  color: 'rgb(0, 0, 255)' },
                { timeOffset: 20000, action: 'OFF',    color: '#000000' }
            ];

            try {
                await setDoc(doc(db, "show", "command"), {
                    triggerId: crypto.randomUUID(),
                    startTime: showStartTime,
                    duration: 25000,
                    timeline: sampleTimeline
                });
                logEl.innerText = "Şov Senaryosu (Timeline) Dağıtıldı!";
                logEl.style.color = "#ff5722";
            } catch (err) {
                console.error("Timeline şov hatası:", err);
                logEl.innerText = "Hata! Senaryo gönderilemedi: " + err.message;
                logEl.style.color = "#f44336";
            }
        };

        // 3. Acil Karartma (STOP) Gönderme
        window.sendEmergencyStop = async function() {
            const logEl = document.getElementById('log');
            try {
                await setDoc(doc(db, "show", "command"), {
                    type: 'STOP',
                    triggerId: crypto.randomUUID(),
                    startTime: Date.now()
                });
                logEl.innerText = "Acil Karartma (STOP) Gönderildi!";
                logEl.style.color = "#f44336";
            } catch (err) {
                console.error("STOP komut hatası:", err);
                logEl.innerText = "Hata! Durdurulamadı: " + err.message;
                logEl.style.color = "#f44336";
            }
        };
    </script>
</body>
</html>
