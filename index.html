<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Yönetici Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; margin-bottom: 10px; }
        .counter-box { background: #2c2c2c; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 16px; border: 1px solid #444; }
        .counter-box span { color: #4CAF50; font-weight: bold; font-size: 20px; }
        
        .color-picker-box { background: #2c2c2c; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #444; }
        .color-picker-box label { font-size: 15px; font-weight: bold; }
        input[type="color"] { width: 50px; height: 35px; border: none; border-radius: 6px; cursor: pointer; background: none; }

        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; color: #fff; }
        .btn-on { background: #4CAF50; }
        .btn-off { background: #f44336; }
        .btn-strobe { background: #2196F3; }
        .btn-pulse { background: #e91e63; }
        #log { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎛️ Lumen Sync Admin</h2>
        
        <div class="counter-box">
            👥 Aktif Katılımcı: <span id="client-count">0</span>
        </div>

        <div class="color-picker-box">
            <label>🎨 Efekt Rengi:</label>
            <input type="color" id="effectColor" value="#ffffff">
        </div>
        
        <button class="btn-on" onclick="sendAction('ON')">Işığı Aç (ON)</button>
        <button class="btn-off" onclick="sendAction('OFF')">Ekranları Kapat (OFF)</button>
        <button class="btn-strobe" onclick="sendAction('STROBE')">Renkli Çakar (STROBE)</button>
        <button class="btn-pulse" onclick="sendAction('PULSE')">💓 Renkli Nefes (PULSE)</button>
        
        <div id="log">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "clients"), (snapshot) => {
            let activeCount = 0;
            const now = Date.now();
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.lastSeen && (now - data.lastSeen < 15000)) {
                    activeCount++;
                }
            });
            document.getElementById('client-count').innerText = activeCount;
        });

        window.sendAction = async function(actionName) {
            const logEl = document.getElementById('log');
            const selectedColor = document.getElementById('effectColor').value;

            try {
                await setDoc(doc(db, "show", "command"), {
                    action: actionName,
                    color: selectedColor,
                    startTime: Date.now(),
                    speed: 110,
                    triggerId: Math.random()
                });
                logEl.innerText = `Komut Gönderildi: ${actionName} (${selectedColor})`;
                logEl.style.color = "#4CAF50";
            } catch (err) {
                console.error(err);
                logEl.innerText = "Hata! Komut iletilemedi.";
                logEl.style.color = "#f44336";
            }
        };
    </script>
</body>
</html>
