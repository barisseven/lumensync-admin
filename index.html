<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Yönetici Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; margin-bottom: 10px; }
        .counter-box { background: #2c2c2c; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 16px; border: 1px solid #444; }
        .counter-box span { color: #4CAF50; font-weight: bold; font-size: 20px; }
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; color: #fff; }
        .btn-auto { background: #ff5722; }
        .btn-on { background: #4CAF50; }
        .btn-off { background: #f44336; }
        .btn-strobe { background: #2196F3; }
        .btn-pulse { background: #e91e63; }
        #log { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎛️ Lumen Sync Admin</h2>
        
        <div class="counter-box">
            👥 Aktif Katılımcı: <span id="client-count">0</span>
        </div>
        
        <button class="btn-auto" onclick="startAutomatedShow()">🚀 Otomatik Şov Başlat (Timeline)</button>
        <button class="btn-on" onclick="sendAction('ON')">Ekranları Aç (ON)</button>
        <button class="btn-off" onclick="sendAction('OFF')">Ekranları Kapat (OFF)</button>
        <button class="btn-strobe" onclick="sendAction('STROBE')">Ritim Çakar (STROBE)</button>
        <button class="btn-pulse" onclick="sendAction('PULSE')">💓 Kalp Atışı / Nefes</button>
        
        <div id="log">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "clients"), (snapshot) => {
            let activeCount = 0;
            const now = Date.now();
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.lastSeen && (now - data.lastSeen < 15000)) {
                    activeCount++;
                }
            });
            document.getElementById('client-count').innerText = activeCount;
        });

        // Şarkının saniye saniye test senaryosu (milisaniye cinsinden ofsetler)
        const sampleTimeline = [
            { timeOffset: 0,     action: 'PULSE',  speed: 0 },   // 0. saniye: Nefes efekti başla
            { timeOffset: 6000,  action: 'ON',     speed: 0 },   // 6. saniye: Sabit beyaz ışık
            { timeOffset: 12000, action: 'STROBE', speed: 80 },  // 12. saniye: Hızlı çakar
            { timeOffset: 20000, action: 'OFF',    speed: 0 }    // 20. saniye: Karartma ve bitiş
        ];

        window.startAutomatedShow = async function() {
            const logEl = document.getElementById('log');
            // 1.5 saniye sonrasını ortak başlangıç saati olarak belirle (ağ gecikmesini tolere etmek için)
            const showStartTime = Date.now() + 1500; 
            
            try {
                await setDoc(doc(db, "show", "command"), {
                    startTime: showStartTime,
                    timeline: sampleTimeline,
                    triggerId: Math.random()
                });
                logEl.innerText = "Otomatik Şov Senaryosu Gönderildi!";
                logEl.style.color = "#ff5722";
            } catch (err) {
                console.error(err);
                logEl.innerText = "Hata! Otomatik şov başlatılamadı.";
                logEl.style.color = "#f44336";
            }
        };

        window.sendAction = async function(actionName) {
            const logEl = document.getElementById('log');
            try {
                await setDoc(doc(db, "show", "command"), {
                    action: actionName,
                    startTime: Date.now(),
                    speed: 110,
                    triggerId: Math.random(),
                    timeline: null // Tekil komut için timeline'ı sıfırla
                });
                logEl.innerText = `Manuel Komut: ${actionName}`;
                logEl.style.color = "#4CAF50";
            } catch (err) {
                console.error(err);
                logEl.innerText = "Hata!";
                logEl.style.color = "#f44336";
            }
        };
    </script>
</body>
</html>
