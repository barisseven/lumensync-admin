<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Yönetici Paneli</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 30px 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ff9800; margin-bottom: 10px; }
        .counter-box { background: #2c2c2c; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 16px; border: 1px solid #444; }
        .counter-box span { color: #4CAF50; font-weight: bold; font-size: 20px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 12px; color: #fff; }
        .btn-start { background: #9c27b0; }
        .btn-on { background: #4CAF50; }
        .btn-off { background: #f44336; }
        .btn-strobe { background: #2196F3; }
        #log { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎛️ Lumen Sync Admin</h2>
        
        <div class="counter-box">
            👥 Bağlı Katılımcı: <span id="client-count">0</span>
        </div>
        
        <button class="btn-start" onclick="startMusicSync()">🎵 Müziği Başlat & Senkronize Et</button>
        <button class="btn-on" onclick="sendAction('ON')">Ekranları Aç (ON)</button>
        <button class="btn-off" onclick="sendAction('OFF')">Ekranları Kapat (OFF)</button>
        <button class="btn-strobe" onclick="sendAction('STROBE')">Ritim Çakar (STROBE)</button>
        
        <div id="log">Durum: Bekleniyor...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Katılımcı sayısını canlı dinle
        onSnapshot(collection(db, "clients"), (snapshot) => {
            document.getElementById('client-count').innerText = snapshot.size;
        });

        window.startMusicSync = async function() {
            const logEl = document.getElementById('log');
            const musicStartTime = Date.now() + 600; 
            
            try {
                await setDoc(doc(db, "show", "command"), {
                    action: 'STROBE',
                    startTime: musicStartTime,
                    speed: 110,
                    triggerId: Math.random()
                });
                logEl.innerText = "Timecode Ritim Başlatıldı!";
                logEl.style.color = "#9c27b0";
            } catch (err) {
                console.error(err);
                logEl.innerText = "Hata! Komut gidemedi.";
                logEl.style.color = "#f44336";
            }
        };

        window.sendAction = async function(actionName) {
            const logEl = document.getElementById('log');
            try {
                await setDoc(doc(db, "show", "command"), {
                    action: actionName,
                    startTime: Date.now(),
                    speed: 110,
                    triggerId: Math.random()
                });
                logEl.innerText = `Komut Gönderildi: ${actionName}`;
                logEl.style.color = "#4CAF50";
            } catch (err) {
                console.error(err);
                logEl.innerText = "Hata! Komut iletilemedi.";
                logEl.style.color = "#f44336";
            }
        };
    </script>
</body>
</html>
