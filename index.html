<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Sync - Yönetici Paneli</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            text-align: center; 
            padding: 20px; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 440px; 
            background: #161b22; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            border: 1px solid #30363d;
            box-sizing: border-box;
        }
        h2 { 
            color: #58a6ff; 
            margin-top: 0;
            margin-bottom: 20px; 
            font-size: 22px;
            letter-spacing: -0.5px;
        }
        .counter-box { 
            background: #21262d; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 15px; 
            border: 1px solid #30363d;
            color: #8b949e;
        }
        .counter-box span { 
            color: #3fb950; 
            font-weight: 700; 
            font-size: 18px; 
        }
        
        .control-group { 
            background: #21262d; 
            padding: 16px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: left; 
            border: 1px solid #30363d; 
        }
        .control-group label { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: #8b949e; 
        }

        /* Renk seçiciyi gizleyip butona tıklatıyoruz */
        .color-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 14px;
        }
        .color-preview-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #ff0000;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .color-preview-btn:active { transform: scale(0.98); }
        
        input[type="color"] {
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        select, input[type="number"] { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #c9d1d9; 
            font-size: 14px;
            box-sizing: border-box; 
            margin-bottom: 14px; 
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        select:focus, input[type="number"]:focus { border-color: #58a6ff; }

        button { 
            width: 100%; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 600; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            color: #fff; 
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        
        .btn-action { background: #238636; }
        .btn-action:hover { background: #2ea043; }

        .btn-preload { background: #1f6feb; }
        .btn-preload:hover { background: #388bfd; }

        .btn-stop { background: #da3633; margin-bottom: 0; }
        .btn-stop:hover { background: #f85149; }

        #log { 
            margin-top: 15px; 
            font-size: 13px; 
            color: #8b949e; 
            word-break: break-word; 
            padding: 8px;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ Lumen Sync Admin</h2>
        
        <div class="counter-box">
            👥 Aktif Katılımcı: <span id="client-count">0</span>
        </div>

        <div class="control-group">
            <label>🎨 Efekt Rengi (Tıkla ve Seç):</label>
            <div class="color-btn-wrapper">
                <button type="button" id="colorBtn" class="color-preview-btn">Seçilen Renk: #ff0000</button>
                <input type="color" id="colorPicker" value="#ff0000" oninput="updateSelectedColor(this.value)">
            </div>

            <label>⚡ Manuel Komut / Aksiyon:</label>
            <select id="manualAction">
                <option value="ON">ON (Işığı Aç)</option>
                <option value="OFF">OFF (Kapat)</option>
                <option value="STROBE" selected>STROBE (Çakar)</option>
                <option value="PULSE">PULSE (Nefes)</option>
            </select>

            <label>⏱️ Hız / Speed (Strobe için ms, örn: 80):</label>
            <input type="number" id="effectSpeed" value="80" min="16" max="5000">
        </div>
        
        <!-- Tam Boy Tekli Butonlar -->
        <button class="btn-action" onclick="sendManualCommand()">Manuel Komut Gönder</button>
        <button class="btn-preload" onclick="sendTimelineShow()">🚀 Şov Senaryosunu Başlat (Timeline)</button>
        <button class="btn-stop" onclick="sendEmergencyStop()">Acil Karartma (STOP)</button>
        
        <div id="log">Durum: Sistem hazır.</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDntqYxoZXhJZmxtbGaPOF54EEW0F1Co8",
            authDomain: "lumensync-brssvn.firebaseapp.com",
            projectId: "lumensync-brssvn",
            storageBucket: "lumensync-brssvn.firebasestorage.app",
            messagingSenderId: "295249691227",
            appId: "1:295249691227:web:a394942537af7b98f5357e",
            measurementId: "G-K75JNFBH3V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let selectedColorHex = "#ff0000";

        // Renk seçildiğinde butonu ve arkaplanını güncelleyen fonksiyon
        window.updateSelectedColor = function(val) {
            selectedColorHex = val;
            const btn = document.getElementById('colorBtn');
            btn.style.backgroundColor = val;
            btn.innerText = `Seçilen Renk: ${val}`;
            
            // Konttrola göre metin rengini siyah/beyaz yap
            const r = parseInt(val.substr(1,2), 16);
            const g = parseInt(val.substr(3,2), 16);
            const b = parseInt(val.substr(5,2), 16);
            const yiq = (r * 299 + g * 587 + b * 114) / 1000;
            btn.style.color = yiq >= 128 ? '#000000' : '#ffffff';
        };

        // Canlı aktif katılımcı sayacı
        onSnapshot(collection(db, "clients"), (snapshot) => {
            let activeCount = 0;
            const now = Date.now();
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                if (data.lastSeen && (now - data.lastSeen < 60000)) {
                    activeCount++;
                }
            });
            document.getElementById('client-count').innerText = activeCount;
        }, (error) => {
            console.warn("Client sayaç dinleme hatası:", error);
        });

        // 1. Manuel Komut Gönderme
        window.sendManualCommand = async function() {
            const logEl = document.getElementById('log');
            const action = document.getElementById('manualAction').value;
            const speed = Number(document.getElementById('effectSpeed').value);

            try {
                await setDoc(doc(db, "show", "command"), {
                    triggerId: crypto.randomUUID(),
                    startTime: Date.now() + 1500,
                    action: action,
                    color: selectedColorHex,
                    speed: speed
                });
                logEl.innerText = `Komut Gönderildi: ${action} (${selectedColorHex})`;
                logEl.style.color = "#3fb950";
            } catch (err) {
                console.error("Manuel komut hatası:", err);
                logEl.innerText = "Hata! Komut iletilemedi.";
                logEl.style.color = "#f85149";
            }
        };

        // 2. Timeline Senaryosu Gönderme
        window.sendTimelineShow = async function() {
            const logEl = document.getElementById('log');
            const showStartTime = Date.now() + 3000;

            const sampleTimeline = [
                { timeOffset: 0,     action: 'ON',     color: '#ff0000' },
                { timeOffset: 5000,  action: 'STROBE', color: '#ffffff', speed: 80 },
                { timeOffset: 12000, action: 'PULSE',  color: '#0066ff' },
                { timeOffset: 20000, action: 'OFF',    color: '#000000' }
            ];

            try {
                await setDoc(doc(db, "show", "command"), {
                    triggerId: crypto.randomUUID(),
                    startTime: showStartTime,
                    duration: 25000,
                    timeline: sampleTimeline
                });
                logEl.innerText = "Şov Senaryosu (Timeline) Dağıtıldı!";
                logEl.style.color = "#58a6ff";
            } catch (err) {
                console.error("Timeline şov hatası:", err);
                logEl.innerText = "Hata! Senaryo gönderilemedi.";
                logEl.style.color = "#f85149";
            }
        };

        // 3. Acil Karartma (STOP) Gönderme
        window.sendEmergencyStop = async function() {
            const logEl = document.getElementById('log');
            try {
                await setDoc(doc(db, "show", "command"), {
                    type: 'STOP',
                    action: 'OFF',
                    color: '#000000',
                    triggerId: crypto.randomUUID(),
                    startTime: Date.now()
                });
                logEl.innerText = "Acil Karartma (STOP) Gönderildi!";
                logEl.style.color = "#f85149";
            } catch (err) {
                console.error("STOP komut hatası:", err);
                logEl.innerText = "Hata! Durdurulamadı.";
                logEl.style.color = "#f85149";
            }
        };
    </script>
</body>
</html>
